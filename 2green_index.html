<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Зеленые зоны Ижевска</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=ваш_ключ&lang=ru_RU" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            background: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .map-container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .map-header {
            padding: 20px 28px 8px 28px;
        }

        .map-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e2a3e;
            letter-spacing: -0.3px;
        }

        .map-header p {
            color: #4a627a;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            background: #d9e2ec;
        }

        #custom-map {
            width: 100%;
            height: 500px;
            background: #d9e2ec;
            z-index: 1;
        }

        .map-footer {
            padding: 18px 28px 24px 28px;
            background: #ffffff;
            border-top: 1px solid #e9edf2;
            font-size: 0.9rem;
            color: #2c3e50;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .address {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: 60px;
        }

        .controls-note {
            font-size: 0.8rem;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 40px;
            color: #3b5c7e;
        }

        @media (max-width: 640px) {
            .map-header h2 {
                font-size: 1.4rem;
            }
            .map-footer {
                flex-direction: column;
                align-items: flex-start;
            }
            .map-container {
                border-radius: 20px;
            }
            #custom-map {
                height: 350px;
            }
        }
    </style>
</head>
<body>

<div class="map-container">
    <div class="map-header">
        <h2>Зеленые зоны Ижевска</h2>
        <p>Интерактивная карта с возможностью приближения и перетаскивания</p>
    </div>

    <div class="map-wrapper">
        <div id="custom-map"></div>
    </div>

    <div class="map-footer">
        <div class="address">
            <span>📍 Ижевск, Удмуртия</span>
        </div>
        <div class="controls-note">
            🖱️ Масштабируй | 📌 Тяни карту | 🔍 Кликай по маркерам
        </div>
    </div>
</div>

<script src="2green_index.js"></script>

</body>
</html>
